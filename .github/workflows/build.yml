name: Build and test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303
      - run: dotnet restore Clc.Configuration.slnx
      - run: dotnet build Clc.Configuration.slnx --configuration Release --no-restore
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: dotnet test Clc.Configuration.slnx --configuration Release --no-build
      - name: Test on Linux except the package consumer
        if: runner.os == 'Linux'
        run: dotnet test Clc.Configuration.slnx --configuration Release --no-build --filter "FullyQualifiedName!~Clc.Configuration.Tests.PackageConsumerTests"
      - name: Test packed package consumer with CommonApplicationData access
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PATH dotnet test Clc.Configuration.slnx --configuration Release --no-build --filter "FullyQualifiedName~Clc.Configuration.Tests.PackageConsumerTests"
